<script>
(function(){
  const modal = document.getElementById('mediaModal');
  const imgEl = document.getElementById('modalImage');
  const leftPane = document.querySelector('#mediaModal .left');
  function setMediaSrc(src, alt){
    imgEl.classList.remove('ready');
    imgEl.alt = alt || 'media';
    imgEl.src = src;                 // set directly on the visible img
    leftPane.style.backgroundImage = 'url(' + JSON.stringify(src).slice(1,-1) + ')'; // fallback paint
    leftPane.style.backgroundSize = 'contain';
    leftPane.style.backgroundPosition = 'center';
    leftPane.style.backgroundRepeat = 'no-repeat';
  }
  
  const avatar = document.getElementById('modalAvatar');
  const user = document.getElementById('modalUser');
  const time = document.getElementById('modalTime');
  const comments = document.getElementById('modalComments');
  const closeBtn = modal.querySelector('.close');
    let currentList = [];
  let currentIndex = 0;

  function collectSiblings(startEl){
    // collects images in the same grid/feed section
    const container = startEl.closest('.grid, .feed') || document;
    const nodes = Array.from(container.querySelectorAll('.post-media img, .tile img'));
    return nodes;
  }

  function getMeta(img){
    // Try to pull meta from surrounding post
    const post = img.closest('.post');
    if(post){
      const u = post.querySelector('.post-header .user')?.textContent?.trim() || 'user';
      const t = post.querySelector('.post-header .time')?.textContent?.trim() || '';
      const a = post.querySelector('.post-header img')?.getAttribute('src') || '';
      const caption = post.querySelector('.caption')?.textContent?.trim() || img.alt || '';
      return {user:u,time:t,avatar:a,caption};
    }
    // Grid tile
    const tile = img.closest('.tile');
    const u = document.querySelector('.username')?.textContent?.trim() || 'user';
    const a = document.querySelector('.avatar img')?.getAttribute('src') || '';
    const caption = img.getAttribute('alt') || '';
    return {user:u,time:'',avatar:a,caption};
  }

  function setComments(text){
    comments.innerHTML = '';
    if(text){
      const block = document.createElement('div');
      block.className = 'comment';
      block.innerHTML = '<div class="who">' + user.textContent + '</div><div>' + text + '</div>';
      comments.appendChild(block);
    } else {
      const empty = document.createElement('div');
      empty.className = 'comment';
      empty.textContent = 'No comments yet. Start the conversation.';
      comments.appendChild(empty);
    }
  }

  function openAt(idx){
    currentIndex = idx;
    const media = currentList[currentIndex];
    const meta = getMeta(media);
    imgEl.src = media.src;
    user.textContent = meta.user;
    time.textContent = meta.time;
    if(meta.avatar){ avatar.src = meta.avatar; avatar.alt = meta.user + ' avatar'; }
    setComments(meta.caption);
    modal.classList.add('open');
    document.body.classList.add('no-scroll');
    modal.setAttribute('aria-hidden','false');
    media.focus?.();
  }

  function close(){
    modal.classList.remove('open');
    document.body.classList.remove('no-scroll');
    modal.setAttribute('aria-hidden','true');
  }

  // Click-to-open (event delegation)
  document.addEventListener('click', function(e){
    const target = e.target;
    if(target.matches('.post-media img, .tile img')){
      currentList = collectSiblings(target);
      const idx = currentList.indexOf(target);
      openAt(idx);
      e.preventDefault();
    }
    if(target === modal) close();
    if(target === closeBtn) close();
    if(target === prevBtn){ openAt((currentIndex - 1 + currentList.length) % currentList.length); }
    if(target === nextBtn){ openAt((currentIndex + 1) % currentList.length); }
  });

  // Keyboard
  document.addEventListener('keydown', function(e){
    if(!modal.classList.contains('open')) return;
    if(e.key === 'Escape') close();
          });
})();
</script>
